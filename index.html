<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@Dqmad</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0f;--fg:#f5f5f7;--mut:#8e8e99;--card:#16161c;--line:#262630;--acc:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(500px circle at 50% 0,#2a1d5c55,transparent 70%),var(--bg)}
main{width:100%;max-width:380px;padding:40px 22px;text-align:center}
.ava{position:relative;width:104px;height:104px;margin:0 auto 18px;animation:in .7s both}
.ava::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#c04cff)}
.ava img{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);display:block;object-fit:cover}
h1{margin:0;font-size:30px;animation:in .7s .1s both}
p{margin:6px 0 26px;color:var(--mut);animation:in .7s .2s both}
h2{margin:26px 0 12px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:left}
a,.pay{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;color:var(--fg);text-decoration:none;transition:transform .2s,border-color .2s;animation:in .7s .3s both}
a:hover,a:active,.pay:hover{transform:translateY(-2px);border-color:var(--acc)}
b{display:block;font-size:17px}
small{display:block;margin-top:3px;color:var(--mut);font-size:14px}
.pay{cursor:pointer;position:relative}
.pay .t{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%}
.num{font-size:19px;font-weight:600;letter-spacing:.06em;word-break:break-all;font-variant-numeric:tabular-nums}
.addr{font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5}
.cp{margin-top:10px;font-size:13px;color:var(--acc);font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(14px)}}

#open{width:100%;margin:0 0 18px;border:1px solid var(--line);border-radius:16px;padding:15px;font-size:16px;font-weight:600;color:var(--fg);cursor:pointer;background:var(--card);transition:transform .15s,border-color .2s;animation:in .7s .3s both}
#open:hover{border-color:var(--acc)}
#open:active{transform:scale(.97)}
#ov{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:#000a;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
#ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:420px;background:#14141a;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);text-align:center}
#ov.on .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:#3a3a46;margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:20px}
.tabs{display:flex;gap:6px;background:#0d0d12;border-radius:14px;padding:5px;margin-bottom:18px}
.tabs button{flex:1;border:0;border-radius:10px;padding:11px 6px;font-size:15px;font-weight:600;color:var(--mut);background:none;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--acc);color:#fff}
.qr{width:200px;height:200px;margin:0 auto 16px;background:#fff;border-radius:18px;padding:12px}
.qr svg{width:100%;height:100%;display:block}
.lbl{font-size:13px;color:var(--mut);margin-bottom:6px}
.val{font-size:17px;font-weight:600;word-break:break-all;line-height:1.4;margin-bottom:6px}
.val.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.note{font-size:12px;color:#ffb347;min-height:16px;margin-bottom:14px}
#cp{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:var(--acc);cursor:pointer;margin-bottom:8px}
#cp.ok{background:#1fb85a}
#x{width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;color:var(--mut);background:none;cursor:pointer}
.tab{width:100%;display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--card);color:var(--fg);font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;transition:border-color .2s;animation:in .7s .3s both}
.tab i{font-style:normal;color:var(--mut);transition:transform .25s}
.tab.on{border-color:var(--acc)}.tab.on i{transform:rotate(180deg)}
#socs{display:none}#socs.on{display:block}
</style></head><body>
